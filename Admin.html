<script>
var S={token:null,user:null,cfg:{},fields:[],records:[],users:[],kategori:[],jenis:[],talkshow:[],tsRecords:[],tq:'',tflt:'all',tft:'',tsel:{},tab:'pendaftar',q:'',sel:{},flt:'all',fj:'',started:false};
var TYPES=[['text','Teks'],['number','Angka'],['tel','No. Telepon'],['email','Email'],['date','Tanggal'],['textarea','Teks Panjang'],['select','Dropdown'],['radio','Pilihan (radio)']];

/* ---------- LOGIN ---------- */
$('loginForm').onsubmit=function(e){
  e.preventDefault();
  var b=$('btnLogin'); b.disabled=true;
  api('login',$('lUser').value,$('lPass').value).then(function(r){
    S.token=r.token; try{sessionStorage.setItem('tk',r.token);}catch(x){}
    return boot();
  }).catch(function(err){toast(err.message,'err');}).then(function(){b.disabled=false;});
};
$('btnLogout').onclick=function(){
  api('logout',S.token).catch(function(){});
  try{sessionStorage.removeItem('tk');}catch(x){}
  location.reload();
};

function boot(){
  return api('adminBootstrap',S.token).then(function(b){
    S.user=b.user;S.cfg=b.settings;S.fields=b.fields;S.records=b.records;S.users=b.users||[];S.kategori=b.kategori||[];S.jenis=b.jenis||[];S.talkshow=b.talkshow||[];S.tsRecords=b.tsRecords||[];
    if(!S.started){S.started=true;S.tab=S.user.role==='admin'?'dashboard':'pendaftar';}
    applyTheme(S.cfg);
    $('loginView').hidden=true;$('appView').hidden=false;
    $('tTitle').textContent=S.cfg.eventName+' — Admin';
    $('tUser').textContent=S.user.nama+' ('+S.user.role+')';
    if(S.cfg.logoUrl){$('tLogo').src=S.cfg.logoUrl;$('tLogo').hidden=false;}else $('tLogo').hidden=true;
    renderNav(); renderTab();
  });
}

function activeFields(){return fieldsFor('pk');}

/* ---------- NAV ---------- */
function renderNav(){
  var tabs=[];
  if(S.user.role==='admin') tabs.push(['dashboard','📊 Dashboard']);
  tabs.push(['pendaftar','📋 Pendaftar'],['tspendaftar','🎤 Pendaftar Talkshow']);
  if(S.user.role==='admin') tabs.push(['tampilan','🎨 Tampilan Halaman'],['formulir','🧩 Field Formulir'],['kategori','👤 Kategori Pendaftar'],['jenis','🩺 Jenis & Kuota'],['talkshow','🎤 Talkshow & Kuota'],['daftarhadir','🖨️ Cetak Daftar Hadir'],['user','👥 Petugas & User']);
  tabs.push(['akun','🔑 Akun Saya']);
  $('nav').innerHTML=tabs.map(function(t){
    return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>';
  }).join('');
  Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
    b.onclick=function(){S.tab=b.dataset.t;renderNav();renderTab();};
  });
}
function renderTab(){
  ({dashboard:tabDashboard,pendaftar:tabPendaftar,tampilan:tabTampilan,formulir:tabFormulir,kategori:tabKategori,jenis:tabJenis,talkshow:tabTalkshow,daftarhadir:tabDaftarHadir,tspendaftar:tabTsPendaftar,user:tabUser,akun:tabAkun})[S.tab]();
}

/* ---------- MODAL ---------- */
function openModal(title,body,onSave,saveLabel){
  var root=$('modalRoot');
  root.innerHTML='<div class="modal-bg"><div class="modal"><h3>'+esc(title)+'</h3><div id="mBody">'+body+'</div>'+
    '<div class="actions"><button class="btn btn-ghost" id="mCancel">Batal</button>'+
    (onSave?'<button class="btn" id="mSave">'+(saveLabel||'Simpan')+'</button>':'')+'</div></div></div>';
  $('mCancel').onclick=closeModal;
  if(onSave) $('mSave').onclick=function(){
    var b=$('mSave'); b.disabled=true;
    Promise.resolve(onSave()).catch(function(e){toast(e.message,'err');}).then(function(){var x=$('mSave');if(x)x.disabled=false;});
  };
}
function closeModal(){$('modalRoot').innerHTML='';}

/* ---------- TAB PENDAFTAR ---------- */
function tabPendaftar(){
  var fs=activeFields(), isAdmin=S.user.role==='admin';
  var show=fs.slice(0,3);
  var q=S.q.toLowerCase();
  var rows=S.records.filter(function(r){
    if(S.flt==='hadir'&&!r.hadir) return false;
    if(S.flt==='belum'&&r.hadir) return false;
    if(S.fj&&r.jenis.indexOf(S.fj)<0) return false;
    if(!q) return true;
    return r.nomor.toLowerCase().indexOf(q)>=0 || Object.keys(r.data).some(function(k){return String(r.data[k]).toLowerCase().indexOf(q)>=0;});
  });
  var today=wibToday();
  var nHadir=S.records.filter(function(r){return r.hadir;}).length;
  var nToday=S.records.filter(function(r){return r.timestamp.slice(0,10)===today;}).length;
  var h='<div class="stat"><div><b>'+S.records.length+'</b><span>Total pendaftar</span></div><div><b>'+nToday+'</b><span>Hari ini</span></div>'+
    '<div><b>'+S.records.filter(function(r){return r.sumber==='manual';}).length+'</b><span>Input manual</span></div>'+
    '<div><b style="color:var(--ok)">'+nHadir+'</b><span>Sudah hadir</span></div></div>';
  h+='<div class="panel" style="padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b>Check-in cepat</b>'+
     '<input type="text" id="ciBox" placeholder="Ketik nomor, mis. 12 atau PK-0012" style="max-width:260px" autocapitalize="characters">'+
     '<button class="btn btn-sm" id="btnCi" style="background:var(--ok)">✔ Tandai Hadir</button>'+
     '<button class="btn btn-sm btn-accent" id="btnScan">📷 Scan QR</button></div>';
  h+='<div class="toolbar"><input type="text" id="qBox" placeholder="Cari nomor / nama…" value="'+esc(S.q)+'">'+
     '<select id="fltBox" style="max-width:160px"><option value="all">Semua</option><option value="hadir">Sudah hadir</option><option value="belum">Belum hadir</option></select>'+
     (S.jenis.length?'<select id="fjBox" style="max-width:200px"><option value="">Semua jenis</option>'+S.jenis.map(function(j){return '<option value="'+esc(j.id)+'">'+esc(j.nama)+'</option>';}).join('')+'</select>':'')+
     '<span class="sp"></span><button class="btn btn-sm btn-accent" id="btnPrintSel">🖨️ Cetak Terpilih (0)</button>'+
     '<button class="btn btn-sm btn-accent" id="btnPrintAll">🖨️ Cetak Semua</button>'+
     '<button class="btn btn-sm" id="btnAdd">＋ Input Manual</button>'+
     '<button class="btn btn-sm btn-ghost" id="btnCsv">⬇ Ekspor CSV</button>'+
     '<button class="btn btn-sm btn-ghost" id="btnRef">⟳ Muat Ulang</button></div>';
  h+='<div class="tablewrap"><table class="t"><thead><tr><th><input type="checkbox" id="chkAll"></th><th>Nomor</th><th>Waktu</th>'+
     show.map(function(f){return '<th>'+esc(f.label)+'</th>';}).join('')+'<th>Kategori</th><th>Jenis</th><th>Hadir</th><th>Sumber</th><th></th></tr></thead><tbody>';
  if(!rows.length) h+='<tr><td colspan="'+(show.length+8)+'" style="text-align:center;color:#64748B;padding:30px">Belum ada data.</td></tr>';
  rows.forEach(function(r){
    h+='<tr><td><input type="checkbox" class="rowchk" data-n="'+esc(r.nomor)+'"'+(S.sel[r.nomor]?' checked':'')+'></td><td><b>'+esc(r.nomor)+'</b></td><td>'+esc(r.timestamp)+'</td>'+
      show.map(function(f){return '<td>'+esc(r.data[f.id]||'-')+'</td>';}).join('')+
      '<td>'+esc(r.kategori_nama||'-')+'</td><td>'+esc(r.jenis_nama||'-')+'</td>'+
      '<td>'+(r.hadir
        ?'<button class="btn btn-sm" style="background:var(--ok)" data-act="unhadir" data-n="'+esc(r.nomor)+'" title="Klik untuk membatalkan">✔ '+esc((r.waktu_hadir||'').slice(11,16))+'</button>'
        :'<button class="btn btn-sm btn-ghost" data-act="hadir" data-n="'+esc(r.nomor)+'">Tandai hadir</button>')+'</td>'+
      '<td><span class="badge '+(r.sumber==='manual'?'manual':'')+'">'+esc(r.sumber)+(r.dibuat_oleh?' · '+esc(r.dibuat_oleh):'')+'</span></td>'+
      '<td style="white-space:nowrap"><button class="btn btn-sm" data-act="print" data-n="'+esc(r.nomor)+'">🖨️ Kartu</button>'+
      (isAdmin?' <button class="btn btn-sm btn-ghost" data-act="edit" data-n="'+esc(r.nomor)+'">Edit</button> <button class="btn btn-sm btn-danger" data-act="del" data-n="'+esc(r.nomor)+'">Hapus</button>':'')+
      '</td></tr>';
  });
  h+='</tbody></table></div>';
  $('main').innerHTML=h;
  var qb=$('qBox'); qb.oninput=function(){S.q=qb.value;var p=qb.selectionStart;tabPendaftar();var n=$('qBox');n.focus();n.setSelectionRange(p,p);};
  $('btnAdd').onclick=function(){openRecordForm(null);};
  $('btnCsv').onclick=exportCsv;
  $('fltBox').value=S.flt;
  $('fltBox').onchange=function(){S.flt=this.value;tabPendaftar();};
  var fj=$('fjBox'); if(fj){fj.value=S.fj;fj.onchange=function(){S.fj=this.value;tabPendaftar();};}
  $('btnCi').onclick=quickCheckin;
  $('btnScan').onclick=openScanner;
  $('ciBox').onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();quickCheckin();}};

  function selRecs(){
    // urut nomor naik (data tersimpan terbaru di atas, jadi dibalik)
    return S.records.filter(function(r){return S.sel[r.nomor];}).reverse();
  }
  function syncSel(){
    var n=Object.keys(S.sel).length;
    $('btnPrintSel').textContent='🖨️ Cetak Terpilih ('+n+')';
    $('chkAll').checked=rows.length>0&&rows.every(function(r){return S.sel[r.nomor];});
  }
  syncSel();
  $('chkAll').onchange=function(){
    var on=this.checked;
    rows.forEach(function(r){ if(on) S.sel[r.nomor]=true; else delete S.sel[r.nomor]; });
    Array.prototype.forEach.call($('main').querySelectorAll('.rowchk'),function(c){c.checked=on;});
    syncSel();
  };
  Array.prototype.forEach.call($('main').querySelectorAll('.rowchk'),function(c){
    c.onchange=function(){
      if(c.checked) S.sel[c.dataset.n]=true; else delete S.sel[c.dataset.n];
      syncSel();
    };
  });
  $('btnPrintSel').onclick=function(){
    var recs=selRecs();
    if(!recs.length){toast('Centang pendaftar yang ingin dicetak.','err');return;}
    printCards(S.cfg,S.fields,recs);
  };
  $('btnPrintAll').onclick=function(){
    if(!rows.length){toast('Tidak ada data untuk dicetak.','err');return;}
    if(!confirm('Cetak '+rows.length+' kartu'+(S.q?' (sesuai hasil pencarian)':'')+'?')) return;
    printCards(S.cfg,S.fields,rows.slice().reverse());
  };
  $('btnRef').onclick=function(){boot().then(function(){toast('Data diperbarui','ok');}).catch(function(e){toast(e.message,'err');});};
  Array.prototype.forEach.call($('main').querySelectorAll('button[data-act]'),function(b){
    b.onclick=function(){
      var rec=S.records.filter(function(r){return r.nomor===b.dataset.n;})[0];
      if(b.dataset.act==='print') printCard(S.cfg,S.fields,rec);
      if(b.dataset.act==='hadir'||b.dataset.act==='unhadir') toggleHadir(rec,b.dataset.act==='hadir');
      if(b.dataset.act==='edit') openRecordForm(rec);
      if(b.dataset.act==='del') {
        if(!confirm('Hapus pendaftar '+rec.nomor+'?')) return;
        api('deletePendaftar',S.token,rec.nomor).then(function(){
          S.records=S.records.filter(function(r){return r.nomor!==rec.nomor;});tabPendaftar();toast('Dihapus','ok');
        }).catch(function(e){toast(e.message,'err');});
      }
    };
  });
}

function openRecordForm(rec){
  var body=pickHolder('pk')+'<div id="mFields_pk"></div>';
  openModal(rec?'Edit '+rec.nomor:'Input Pendaftar Manual',body,function(){
    var fs=fieldsFor('pk',modalKat('pk'));
    var data=collectForm($('mBody'),fs);
    var miss=missingRequired(fs,data);
    if(miss){toast('"'+miss+'" wajib diisi.','err');return;}
    var pk=pickCollect('pk',rec);
    if(pk.err){toast(pk.err,'err');return;}
    if(rec){
      return api('updatePendaftar',S.token,rec.nomor,data,pk.changed?pk.kat:null,pk.changed?pk.ids:null).then(function(r){
        rec.data=data;
        if(r&&pk.changed){rec.kategori=r.kategori;rec.kategori_nama=r.kategori_nama;rec.jenis=r.jenis;rec.jenis_list=r.jenis_list;rec.jenis_nama=r.jenis_nama;}
        closeModal();tabPendaftar();toast('Tersimpan','ok');
      });
    }
    return api('addPendaftar',S.token,data,pk.kat,pk.ids).then(function(nr){
      if(nr&&nr.duplicate){
        alert((nr.label||'Nama')+' tersebut sudah terdaftar dengan nomor '+nr.nomor+(nr.jenis_nama?' ('+nr.jenis_nama+')':'')+'.');
        S.q=nr.nomor;S.flt='all';S.fj='';closeModal();tabPendaftar();return;
      }
      S.records.unshift(nr);closeModal();tabPendaftar();toast('Tersimpan: '+nr.nomor,'ok');
      if(confirm('Cetak kartu untuk '+nr.nomor+' sekarang?')) printCard(S.cfg,S.fields,nr);
    });
  });
  pickInit('pk',rec);
  drawModalFields('pk',rec?rec.data:{});
}

function exportCsv(){
  var fs=S.fields;
  var head=['Nomor','Waktu','Sumber','Dibuat oleh','Kategori','Jenis Pemeriksaan','Hadir','Waktu Hadir'].concat(fs.map(function(f){return f.label;}));
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var lines=[head.map(q).join(',')];
  S.records.forEach(function(r){
    lines.push([r.nomor,r.timestamp,r.sumber,r.dibuat_oleh,r.kategori_nama||'',r.jenis_nama||'',r.hadir?'Ya':'Tidak',r.waktu_hadir||''].concat(fs.map(function(f){return r.data[f.id]||'';})).map(q).join(','));
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='pendaftar-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

/* ---------- KEHADIRAN ---------- */
function wibToday(){return new Date(Date.now()+7*3600*1000).toISOString().slice(0,10);}
function nameOf(r){var f=fieldsFor(r.tipe==='ts'?'ts':'pk')[0];return f?(r.data[f.id]||'-'):'-';}

function toggleHadir(rec,val){
  if(!val&&!confirm('Batalkan kehadiran '+rec.nomor+'?')) return;
  api('setHadir',S.token,rec.nomor,val).then(function(r){
    rec.hadir=r.hadir;rec.waktu_hadir=r.waktu_hadir;rec.dicek_oleh=r.dicek_oleh;
    renderTab();
    toast(val?rec.nomor+' ditandai hadir':'Kehadiran dibatalkan','ok');
  }).catch(function(e){toast(e.message,'err');});
}

function quickCheckin(){
  var el=$('ciBox'); var v=el.value.trim().toUpperCase(); if(!v) return;
  var rec;
  if(/^\d+$/.test(v)){
    var pk=(S.cfg.prefix||'PK')+'-'+('0000'+v).slice(-4), tk=(S.cfg.prefixTalkshow||'TS')+'-'+('0000'+v).slice(-4);
    var a=findRec(pk), b2=findRec(tk);
    if(a&&b2){toast('Nomor '+v+' ada di pemeriksaan dan talkshow. Ketik lengkap: '+pk+' atau '+tk+'.','err');return;}
    v=b2?tk:pk; rec=a||b2;
  } else rec=findRec(v);
  if(!rec){toast('Nomor '+v+' tidak ditemukan.','err');return;}
  if(rec.hadir){toast(v+' ('+nameOf(rec)+') sudah tercatat hadir pukul '+rec.waktu_hadir.slice(11,16)+'.');el.value='';el.focus();return;}
  api('setHadir',S.token,v,true).then(function(r){
    rec.hadir=true;rec.waktu_hadir=r.waktu_hadir;rec.dicek_oleh=r.dicek_oleh;
    renderTab();
    toast('✔ '+v+' — '+nameOf(rec)+' hadir','ok');
    var n=$('ciBox'); if(n) n.focus();
  }).catch(function(e){toast(e.message,'err');});
}

/* ---------- SCAN QR KEHADIRAN ---------- */
var SC={stream:null,timer:0,det:null,last:'',lastT:0,count:0,cv:null};
function scMsg(t,type){var e=$('scMsg');if(!e)return;e.textContent=t;e.className='scmsg '+(type||'');}
function parseNomor(text){
  var m=String(text||'').toUpperCase().match(/[A-Z0-9]{1,8}-\d{3,6}/);
  return m?m[0]:'';
}
var _ac;
function beep(ok){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=_ac.createOscillator(),g=_ac.createGain();
    o.frequency.value=ok?880:220;g.gain.value=0.08;
    o.connect(g);g.connect(_ac.destination);
    o.start();o.stop(_ac.currentTime+(ok?0.12:0.3));
  }catch(e){}
}
function loadJsQR(){
  var urls=['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'];
  return new Promise(function(res,rej){
    if(window.jsQR) return res();
    var i=0;
    (function next(){
      if(i>=urls.length) return rej(new Error('Pustaka pemindai gagal dimuat. Periksa koneksi internet.'));
      var s=document.createElement('script');
      s.src=urls[i++];
      s.onload=function(){ if(window.jsQR) res(); else next(); };
      s.onerror=function(){ s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}
function prepDecoder(){
  if('BarcodeDetector' in window){
    try{SC.det=new BarcodeDetector({formats:['qr_code']});return Promise.resolve();}catch(e){SC.det=null;}
  }
  return loadJsQR();
}
function camErr(e){
  var n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError') return 'Kamera langsung tidak bisa dibuka. Jika izin kamera sudah diberikan, penyebabnya Google Apps Script memblokir kamera di halaman ini. Tekan tombol "Foto QR" di bawah: kamera ponsel akan terbuka, foto QR pada kartu, dan kehadiran langsung tercatat.';
  if(n==='NotFoundError'||n==='OverconstrainedError') return 'Kamera tidak ditemukan di perangkat ini.';
  return (e&&e.message)?e.message:'Kamera tidak dapat dibuka.';
}
function openScanner(){
  SC.last='';SC.lastT=0;SC.count=0;
  openModal('Scan QR Kehadiran',
    '<div class="scanbox" id="scBox"><video id="scVideo" playsinline muted></video><div class="scanframe"></div></div>'+
    '<div class="scmsg" id="scMsg">Mengaktifkan kamera…</div>'+
    '<div style="margin-top:10px;text-align:center"><label class="btn btn-sm btn-accent" style="cursor:pointer">📸 Foto QR<input type="file" id="scFile" accept="image/*" capture="environment" hidden></label></div>'+
    '<p style="font-size:12px;color:#64748B;margin:10px 0 0">Arahkan kamera ke QR pada kartu pendaftar. Pemindaian berjalan terus sampai jendela ini ditutup. Jika kamera langsung tidak bisa dibuka, tekan Foto QR: kamera ponsel terbuka, foto QR pada kartu, dan kehadiran langsung tercatat. Cadangan lain: kolom Check-in cepat atau scanner barcode USB.</p>',null);
  $('mCancel').textContent='Tutup';
  $('mCancel').onclick=closeScanner;
  $('scFile').onchange=onScanFile;
  startScan();
}
function closeScanner(){stopScan();closeModal();}
function stopScan(){
  clearTimeout(SC.timer);SC.timer=0;
  if(SC.stream){SC.stream.getTracks().forEach(function(t){t.stop();});SC.stream=null;}
}
function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    var bx0=$('scBox');if(bx0)bx0.style.display='none';
    scMsg('Kamera langsung tidak tersedia di halaman ini. Tekan tombol "Foto QR" di bawah, atau pakai kolom Check-in cepat.','err');return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})
  .then(function(stream){
    var v=$('scVideo');
    if(!v){stream.getTracks().forEach(function(t){t.stop();});return Promise.reject(null);}
    SC.stream=stream;v.srcObject=stream;
    return v.play();
  })
  .then(prepDecoder)
  .then(function(){scMsg('Arahkan kamera ke QR…','');scanLoop();})
  .catch(function(e){if(e===null)return;stopScan();var bx=$('scBox');if(bx)bx.style.display='none';scMsg(camErr(e),'err');});
}
function scanLoop(){
  if(!SC.stream) return;
  var v=$('scVideo');
  if(!v||v.readyState<2||!v.videoWidth){SC.timer=setTimeout(scanLoop,150);return;}
  var p;
  if(SC.det){
    p=SC.det.detect(v).then(function(r){return r.length?r[0].rawValue:'';});
  }else{
    var w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
    var cv=SC.cv||(SC.cv=document.createElement('canvas'));
    cv.width=w;cv.height=h;
    var cx=cv.getContext('2d',{willReadFrequently:true});
    cx.drawImage(v,0,0,w,h);
    var im=cx.getImageData(0,0,w,h);
    var q=window.jsQR(im.data,w,h,{inversionAttempts:'dontInvert'});
    p=Promise.resolve(q?q.data:'');
  }
  p.then(function(txt){if(txt)onScan(txt);}).catch(function(){})
   .then(function(){if(SC.stream)SC.timer=setTimeout(scanLoop,SC.det?120:180);});
}
function decodeFile(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      prepDecoder().then(function(){
        var sizes=[1600,1000,600],i=0;
        (function next(){
          if(i>=sizes.length) return res('');
          var m=Math.max(img.naturalWidth,img.naturalHeight),sc=Math.min(1,sizes[i++]/m);
          var w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));
          var cv=document.createElement('canvas');cv.width=w;cv.height=h;
          var cx=cv.getContext('2d',{willReadFrequently:true});
          cx.drawImage(img,0,0,w,h);
          var p;
          if(SC.det){
            p=SC.det.detect(cv).then(function(r){return r.length?r[0].rawValue:'';});
          }else{
            var im=cx.getImageData(0,0,w,h);
            var q=window.jsQR(im.data,w,h,{inversionAttempts:'attemptBoth'});
            p=Promise.resolve(q?q.data:'');
          }
          p.then(function(t){if(t)res(t);else next();}).catch(function(){next();});
        })();
      }).catch(rej);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Foto tidak bisa dibaca.'));};
    img.src=url;
  });
}
function onScanFile(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!f) return;
  scMsg('Membaca foto…','');
  decodeFile(f).then(function(txt){
    if(txt){SC.last='';onScan(txt);}
    else{beep(false);scMsg('QR tidak terbaca. Dekatkan kamera ke QR, pastikan fokus dan tidak buram, lalu foto lagi.','err');}
  }).catch(function(e){scMsg((e&&e.message)||'Foto tidak bisa dibaca.','err');});
}
function onScan(txt){
  var nomor=parseNomor(txt),now=Date.now();
  if(!nomor){
    if(txt!==SC.last||now-SC.lastT>3000){beep(false);scMsg('QR tidak dikenali (bukan kartu pendaftar).','err');}
    SC.last=txt;SC.lastT=now;return;
  }
  if(nomor===SC.last&&now-SC.lastT<4000){SC.lastT=now;return;} // kartu yang sama masih di depan kamera
  SC.last=nomor;SC.lastT=now;
  var rec=findRec(nomor);
  if(rec&&rec.hadir){
    beep(false);
    scMsg('Sudah tercatat hadir: '+nomor+' — '+nameOf(rec)+' (pukul '+(rec.waktu_hadir||'').slice(11,16)+')','warn');
    return;
  }
  scMsg('Memproses '+nomor+'…','');
  api('setHadir',S.token,nomor,true).then(function(r){
    function done(rr){
      if(rr){rr.hadir=true;rr.waktu_hadir=r.waktu_hadir;rr.dicek_oleh=r.dicek_oleh;}
      if(!rr&&r.talkshow_nama) rr=null;
      var nm=rr?nameOf(rr):'';
      if(r.sudah){
        beep(false);
        scMsg('Sudah tercatat hadir: '+nomor+(nm?' — '+nm:'')+' (pukul '+(r.waktu_hadir||'').slice(11,16)+')','warn');
      }else{
        SC.count++;beep(true);if(navigator.vibrate)navigator.vibrate(120);
        scMsg('✔ '+nomor+(nm?' — '+nm:'')+(rr&&(rr.jenis_nama||rr.talkshow_nama)?' · '+(rr.jenis_nama||rr.talkshow_nama):(r.talkshow_nama||r.jenis_nama?' · '+(r.talkshow_nama||r.jenis_nama):''))+'  (total '+SC.count+')','ok');
      }
      if(S.tab==='pendaftar'||S.tab==='tspendaftar') renderTab();
    }
    if(rec) return done(rec);
    // pendaftar baru dari online yang belum ada di layar ini: muat ulang data dulu
    return boot().then(function(){done(findRec(nomor));});
  }).catch(function(e){beep(false);scMsg(e.message,'err');});
}

      h+=avail.map(function(x){
        var sisa=x.kuota===null?null:x.kuota-(used[x.id]||0);
        var full=sisa!==null&&sisa<=0&&own.indexOf(x.id)<0;
        return '<label class="pickrow'+(full?' off':'')+'"><input type="'+(multi?'checkbox':'radio')+'" name="pi_'+kind+'" data-pi value="'+esc(x.id)+'"'+(st.sel.indexOf(x.id)>=0&&!full?' checked':'')+(full?' disabled':'')+'> '+esc(x.nama)+
          '<span>'+(sisa===null?'tanpa batas':'sisa '+Math.max(0,sisa))+(full?' · penuh':'')+(x.active?'':' · nonaktif')+'</span></label>';
      }).join('')+'</div>';
    }
  }
  el.innerHTML=h;
}
/** Hasil: {kat, ids, changed, err}. changed=false bila sama dengan data tersimpan (edit). */
function pickCollect(kind,rec){
  var st=PICK[kind], ks=$('mKat_'+kind);
  var kat=ks?ks.value:'';
  var ids=Array.prototype.map.call($('mPick_'+kind).querySelectorAll('input[data-pi]:checked'),function(i){return i.value;});
  var noun=kind==='ts'?'talkshow':'jenis pemeriksaan';
  if(ks&&!kat) return {err:'Pilih kategori pendaftar.'};
  var kobj=S.kategori.filter(function(k){return k.id===kat;})[0];
  var avail=pickItemsOf(kind).filter(function(x){return x.active&&(!kobj||!x.sasaran.length||x.sasaran.indexOf(kobj.id)>=0);});
  if(avail.length&&!ids.length) return {err:'Pilih minimal satu '+noun+'.'};
  var same=rec&&kat===(rec.kategori||'')&&ids.slice().sort().join(',')===pickRecIds(kind,rec).slice().sort().join(',');
  return {kat:kat,ids:ids,changed:!same};
}

  return S.fields.filter(function(f){
    if(!f.active) return false;

function openTsForm(rec){
  if(!S.talkshow.some(function(t){return t.active;})&&!rec){toast('Belum ada talkshow aktif. Tambahkan di menu Talkshow & Kuota.','err');return;}
  var body=pickHolder('ts')+'<div id="mFields_ts"></div>';
  openModal(rec?'Edit '+rec.nomor:'Input Pendaftar Talkshow',body,function(){
    var fs=fieldsFor('ts',modalKat('ts'));
    var data=collectForm($('mBody'),fs);
    var miss=missingRequired(fs,data);
    if(miss){toast('"'+miss+'" wajib diisi.','err');return;}
    var pk=pickCollect('ts',rec);
    if(pk.err){toast(pk.err,'err');return;}
    if(!pk.ids.length){toast('Pilih minimal satu talkshow.','err');return;}
    if(rec){
      return api('updateTsPendaftar',S.token,rec.nomor,data,pk.changed?pk.kat:null,pk.changed?pk.ids:null).then(function(r){
        rec.data=data;
        if(r&&pk.changed){rec.kategori=r.kategori;rec.kategori_nama=r.kategori_nama;rec.talkshow=r.talkshow;rec.talkshow_list=r.talkshow_list;rec.talkshow_nama=r.talkshow_nama;}
        closeModal();tabTsPendaftar();toast('Tersimpan','ok');
      });
    }
    return api('addTsPendaftar',S.token,data,pk.kat,pk.ids).then(function(nr){
      if(nr&&nr.duplicate){
        alert((nr.label||'Nama')+' tersebut sudah terdaftar di talkshow dengan nomor '+nr.nomor+(nr.talkshow_nama?' ('+nr.talkshow_nama+')':'')+'.');
        S.tq=nr.nomor;S.tflt='all';S.tft='';closeModal();tabTsPendaftar();return;
      }
      S.tsRecords.unshift(nr);closeModal();tabTsPendaftar();toast('Tersimpan: '+nr.nomor,'ok');
      if(confirm('Cetak kartu untuk '+nr.nomor+' sekarang?')) printCard(S.cfg,S.fields,nr);
    });
  });
  pickInit('ts',rec);
  drawModalFields('ts',rec?rec.data:{});
}
function exportTsCsv(){
  var fs=fieldsFor('ts');
  var head=['Nomor','Waktu','Sumber','Dibuat oleh','Kategori','Talkshow','Hadir','Waktu Hadir'].concat(fs.map(function(f){return f.label;}));
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var lines=[head.map(q).join(',')];
  S.tsRecords.forEach(function(r){
    lines.push([r.nomor,r.timestamp,r.sumber,r.dibuat_oleh,r.kategori_nama||'',r.talkshow_nama||'',r.hadir?'Ya':'Tidak',r.waktu_hadir||''].concat(fs.map(function(f){return r.data[f.id]||'';})).map(q).join(','));
  });
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='pendaftar-talkshow-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();a.remove();
}

function imgPanel(kind,title,url){
  return '<div class="panel"><h3>'+title+'</h3><div class="imgprev">'+(url?'<img src="'+esc(url)+'">':'<span style="color:#94A3B8">Belum ada gambar</span>')+'</div>'+
    '<input type="file" id="f_'+kind+'" accept="image/png,image/jpeg,image/webp">'+
    (url?' <button class="btn btn-sm btn-ghost" id="rm_'+kind+'" style="margin-top:8px">Hapus</button>':'')+'</div>';
}
function compressImage(file,maxPx,mime){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var sc=Math.min(1,maxPx/Math.max(img.width,img.height));
      var cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      var ctx=cv.getContext('2d');
      if(mime==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);}
      ctx.drawImage(img,0,0,cv.width,cv.height);
      var d=cv.toDataURL(mime,0.85);
      URL.revokeObjectURL(url);
      res({mime:mime,b64:d.split(',')[1]});
    };
    img.onerror=function(){rej(new Error('File gambar tidak bisa dibaca.'));};
    img.src=url;
  });
}

/* ---------- TAB FORMULIR ---------- */
var FDRAFT=null;
function tabFormulir(){
  if(!FDRAFT){
    FDRAFT=JSON.parse(JSON.stringify(S.fields));
    FDRAFT.forEach(function(f){f.sel=(f.sasaran&&f.sasaran.length)?f.sasaran.slice():katIds();});
  }
  var h='<div class="panel"><h3>Data yang diminta saat pendaftaran</h3>'+
    '<p style="font-size:13px;color:#64748B;margin-top:0">Atur label, tipe, wajib/tidak, dan urutan. Centang <b>Unik</b> pada isian yang tidak boleh sama antar pendaftar (mis. Nama Lengkap): pendaftar yang namanya sudah ada akan diberi tahu nomor registrasinya. Untuk tipe Dropdown/Radio isi pilihan dipisah koma. Di bawah tiap isian, centang <b>Ditanyakan ke kategori</b> (mis. hanya Anak atau hanya Orang Tua) agar isian itu hanya muncul untuk kategori tersebut. Field yang dinonaktifkan tidak tampil di formulir, tetapi data lama tetap tersimpan.</p><div id="fList"></div>'+
    '<div style="display:flex;gap:10px;margin-top:12px"><button class="btn btn-ghost btn-sm" id="fAdd">＋ Tambah Field</button><button class="btn" id="fSave">Simpan Formulir</button></div></div>';
  $('main').innerHTML=h;
  drawFields();
  $('fAdd').onclick=function(){
    FDRAFT.push({id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),label:'',type:'text',required:false,options:'',active:true,unique:false,untuk:'semua',sel:katIds()});
    drawFields();
  };
  $('fSave').onclick=function(){
    var b=$('fSave'); b.disabled=true;
    api('saveFields',S.token,FDRAFT.map(function(f){var o={};for(var k in f)o[k]=f[k];o.sasaran=f.sel;delete o.sel;return o;})).then(function(f){S.fields=f;FDRAFT=null;toast('Formulir tersimpan','ok');tabFormulir();})
      .catch(function(e){toast(e.message,'err');}).then(function(){b.disabled=false;});
  };
}
function drawFields(){
  $('fList').innerHTML=FDRAFT.map(function(f,i){
    return '<div class="frow '+(f.active?'':'inactive')+'" data-i="'+i+'">'+
      '<input type="text" data-k="label" value="'+esc(f.label)+'" placeholder="Label field">'+
      '<select data-k="type">'+TYPES.map(function(t){return '<option value="'+t[0]+'"'+(f.type===t[0]?' selected':'')+'>'+t[1]+'</option>';}).join('')+'</select>'+
      '<input type="text" data-k="options" value="'+esc(f.options)+'" placeholder="Pilihan (a,b,c)" '+((f.type==='select'||f.type==='radio')?'':'disabled')+'>'+
      '<select data-k="untuk" title="Isian ini dipakai untuk kegiatan apa"><option value="semua"'+((f.untuk||'semua')==='semua'?' selected':'')+'>Semua kegiatan</option><option value="pk"'+(f.untuk==='pk'?' selected':'')+'>Hanya pemeriksaan</option><option value="ts"'+(f.untuk==='ts'?' selected':'')+'>Hanya talkshow</option></select>'+
      '<label class="chk"><input type="checkbox" data-k="required" '+(f.required?'checked':'')+'>Wajib</label>'+
      '<label class="chk"><input type="checkbox" data-k="active" '+(f.active?'checked':'')+'>Aktif</label>'+
      '<label class="chk" title="Tidak boleh ada dua pendaftar dengan isian yang sama"><input type="checkbox" data-k="unique" '+(f.unique?'checked':'')+'>Unik</label>'+
      '<span style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-m="up">↑</button> <button class="btn btn-sm btn-ghost" data-m="down">↓</button> <button class="btn btn-sm btn-danger" data-m="del">✕</button></span>'+
      (S.kategori.length?'<div class="katsel"><span>Ditanyakan ke kategori:</span>'+S.kategori.map(function(k){
        return '<label class="chk"><input type="checkbox" data-kat="'+esc(k.id)+'" '+(f.sel.indexOf(k.id)>=0?'checked':'')+'>'+esc(k.nama)+(k.active?'':' <i>(nonaktif)</i>')+'</label>';
      }).join('')+'</div>':'')+'</div>';
  }).join('');
  Array.prototype.forEach.call($('fList').querySelectorAll('.frow'),function(row){
    var i=Number(row.dataset.i);
    Array.prototype.forEach.call(row.querySelectorAll('[data-k]'),function(el){
      el.onchange=el.oninput=function(){
        var k=el.dataset.k;
        FDRAFT[i][k]=el.type==='checkbox'?el.checked:el.value;
        if(k==='type'||k==='active') drawFields();
      };
    });
    Array.prototype.forEach.call(row.querySelectorAll('[data-kat]'),function(el){
      el.onchange=function(){
        var a=FDRAFT[i].sel, id=el.dataset.kat, at=a.indexOf(id);
        if(el.checked&&at<0) a.push(id);
        if(!el.checked&&at>=0) a.splice(at,1);
      };
    });
    Array.prototype.forEach.call(row.querySelectorAll('[data-m]'),function(bt){
      bt.onclick=function(){
        var m=bt.dataset.m;
        if(m==='up'&&i>0){var t=FDRAFT[i];FDRAFT[i]=FDRAFT[i-1];FDRAFT[i-1]=t;}
        if(m==='down'&&i<FDRAFT.length-1){var t2=FDRAFT[i];FDRAFT[i]=FDRAFT[i+1];FDRAFT[i+1]=t2;}
        if(m==='del'){ if(!confirm('Hapus field "'+(FDRAFT[i].label||'baru')+'"? Data lama field ini tidak akan tampil lagi.')) return; FDRAFT.splice(i,1); }
        drawFields();
      };
    });
  });
}
